name: Check

# Validates every branch and pull request. Deployment stays in deploy.yml
# (main only); this workflow never deploys and needs no secrets.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Synchronize portfolio metadata
        run: npm run sync:portfolio
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The Snake build is skipped here: pages render without it.
      - name: Type-check and build
        run: npm run build:site
